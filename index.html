<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Astoria Poker</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
  text-align: center;
}

/* Фон */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at top, #111, #000);
  z-index: -1;
}

/* Контейнер */
.container {
  padding: 20px;
  max-width: 420px;
  margin: auto;
}

/* Лого */
.logo {
  font-size: 22px;
  font-weight: bold;
  margin-top: 20px;
  color: gold;
}

/* Заголовок */
h1 {
  font-size: 28px;
  margin-top: 40px;
  line-height: 1.3;
}

/* Подзаголовок */
p {
  opacity: 0.85;
  margin-top: 15px;
}

/* Кнопка */
.btn {
  display: block;
  margin: 30px 0;
  padding: 16px;
  border-radius: 12px;
  background: linear-gradient(45deg, #ffd700, #ffae00);
  color: #000;
  font-weight: bold;
  text-decoration: none;
  font-size: 18px;
  box-shadow: 0 0 20px rgba(255,215,0,0.6);
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.07); }
  100% { transform: scale(1); }
}

/* Таймер */
.timer {
  color: #ff4444;
  font-weight: bold;
  margin-top: 10px;
}

/* Фейковые выигрыши */
.win {
  background: rgba(255,255,255,0.05);
  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
  font-size: 14px;
  text-align: left;
  animation: fadeIn 1s;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

/* Нижняя кнопка */
.bottom {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 10px;
  background: #000;
}

.bottom a {
  display: block;
  background: #ffd700;
  padding: 14px;
  border-radius: 10px;
  color: #000;
  font-weight: bold;
  text-decoration: none;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

  <div class="logo">ASTORIA POKER</div>

  <h1>Зарабатывай на игре</h1>
  <p>Играй онлайн и выводи реальные деньги каждый день</p>

  <a href="#" class="btn">ИГРАТЬ СЕЙЧАС</a>

  <div class="timer" id="timer">
    Осталось мест: 8
  </div>

  <div id="wins"></div>

</div>

<div class="bottom">
  <a href="#">ПОЛУЧИТЬ ДОСТУП</a>
</div>

<script>
// таймер мест
let spots = 8;
setInterval(() => {
  if (spots > 2) {
    spots--;
    document.getElementById("timer").innerText = "Осталось мест: " + spots;
  }
}, 4000);

// фейковые выигрыши
const names = ["Азамат", "Руслан", "Данияр", "Нурсултан", "Илья"];
const amounts = ["12 000 сом", "8 500 сом", "15 200 сом", "6 700 сом"];

setInterval(() => {
  const name = names[Math.floor(Math.random() * names.length)];
  const amount = amounts[Math.floor(Math.random() * amounts.length)];

  const div = document.createElement("div");
  div.className = "win";
  div.innerText = name + " выиграл " + amount;

  const wins = document.getElementById("wins");
  wins.prepend(div);

  if (wins.children.length > 4) {
    wins.removeChild(wins.lastChild);
  }
}, 3000);
</script>

</body>
</html>
